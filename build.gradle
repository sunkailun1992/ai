plugins {
    id "java"                                      // 启用 Java 编译、测试和 Jar 相关 Gradle 任务。
    id "org.springframework.boot"                  // 启用 Spring Boot 打包、bootRun 和自动主类解析能力。
    id "io.spring.dependency-management"           // 复用 Maven BOM 风格的依赖版本管理，保持微服务版本集中。
}

group = "com.kellen"                               // 发布坐标的 group，与 Java 包名保持一致。
version = '1.6.3'                                  // 应用版本号；部署包名称由 bootJar 独立配置。

def privateMavenUrl = providers.gradleProperty("privateMavenUrl")
        .orElse(providers.environmentVariable("PRIVATE_MAVEN_URL"))
def privateMavenUsername = providers.gradleProperty("privateMavenUsername")
        .orElse(providers.environmentVariable("PRIVATE_MAVEN_USERNAME"))
def privateMavenPassword = providers.gradleProperty("privateMavenPassword")
        .orElse(providers.environmentVariable("PRIVATE_MAVEN_PASSWORD"))

ext {
    versions = [                                   // 集中管理非 Spring Boot BOM 直接声明的关键版本。
            java              : 17,                // 项目统一使用 Java 17，和现有微服务项目保持一致。
            springCloud       : "2025.1.1",        // Spring Cloud 版本对齐 Spring Boot 4.0.x。
            springCloudAlibaba: "2025.1.0.0",      // Spring Cloud Alibaba 版本用于接入现有 Nacos 体系。
            nacosClient       : "3.2.2",           // Nacos Client 显式对齐当前配置中心 / 注册中心服务端。
            mybatisPlus       : "3.5.16",          // MyBatis-Plus 版本对齐 user/message。
            utils             : "1.6.2",           // 公共 utils 包版本，统一 PostgreSQL 数据源与安全观测能力。
            rpcApi            : "1.0.8",           // 公共 RPC 契约包版本，provider/consumer 必须保持一致。
            aliyunOss         : "3.17.4"           // 阿里云 OSS SDK 版本，沿用历史项目验证过的主版本。
    ]                                              // 版本表结束。
}

java {
    toolchain {                                    // 使用 Gradle Toolchain 固定 Java 编译版本。
        languageVersion = JavaLanguageVersion.of(versions.java as int) // 要求 Gradle 使用 Java 17 编译源码。
    }                                              // Toolchain 配置结束。
}

springBoot {
    mainClass = "com.kellen.AiApplication"         // 显式声明 Boot 4 打包入口，避免自动扫描受测试类或包结构影响。
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url "https://maven.aliyun.com/repository/public" }
    if (privateMavenUrl.isPresent()) {
        maven {
            name = "privateRelease"
            url = uri(privateMavenUrl.get())
            if (privateMavenUsername.isPresent() && privateMavenPassword.isPresent()) {
                credentials {
                    username = privateMavenUsername.get()
                    password = privateMavenPassword.get()
                }
            }
        }
    }
}

bootJar {
    enabled = true
    inputs.property('applicationVersion', project.version) // 固定包名时，版本变化也必须触发重新打包。
    archiveFileName = "${project.name}.jar"         // 固定部署包名为 ai.jar，不受 Gradle version 影响。
}

dependencyManagement {
    imports {                                      // 引入微服务 BOM，避免每个 Spring Cloud 模块手写版本。
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${versions.springCloud}" // 锁定 Spring Cloud 组件版本。
        mavenBom "com.alibaba.cloud:spring-cloud-alibaba-dependencies:${versions.springCloudAlibaba}" // 锁定 Nacos 适配版本。
        // 对齐 utils 的 OpenTelemetry API/context/common，覆盖 Boot BOM 的较旧约束。
        mavenBom "io.opentelemetry:opentelemetry-bom:1.59.0"
    }                                              // BOM 导入结束。
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-web"         // 提供 REST Controller、JSON 序列化和内置 Web 容器。
    implementation "org.springframework.boot:spring-boot-starter-webflux"     // 提供 Flux 流式响应和调用 ai-agent 所需的 WebClient。
    implementation "org.springframework.boot:spring-boot-starter-actuator"     // 暴露健康检查，供网关和注册中心运维观察。
    implementation "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-discovery" // 接入 Nacos 注册中心。
    implementation "com.alibaba.cloud:spring-cloud-starter-alibaba-nacos-config"    // 接入 Nacos 配置中心。
    implementation "com.alibaba.nacos:nacos-client:${versions.nacosClient}"          // 直接使用 Nacos 3.2 AI Registry SDK 读取 AgentCard。
    implementation "com.baomidou:mybatis-plus-spring-boot4-starter:${versions.mybatisPlus}" // 使用 MyBatis-Plus 替代 JPA 访问 MySQL。
    implementation "com:rpc-api:${versions.rpcApi}"                           // 引入跨服务 Dubbo RPC 接口和 DTO 契约，避免在业务服务内复制接口。
    implementation "com:utils:${versions.utils}"                               // 作为 fleet 成员完整引入 utils：动态数据源、MyBatis-Mate、Security、Seata 等共享能力。
    implementation "com.aliyun.oss:aliyun-sdk-oss:${versions.aliyunOss}"        // 提供 OSS PostObject 签名策略和短时签名访问 URL。
    runtimeOnly "org.postgresql:postgresql"                                  // 运行期连接 PostgreSQL 的 JDBC 驱动。
    testImplementation "org.springframework.boot:spring-boot-starter-test"    // 提供 JUnit、Mockito 和 Spring Boot 测试基础能力。
    testImplementation "io.opentelemetry:opentelemetry-sdk-testing:1.59.0" // 仅测试真实 service 的 trace 生命周期。
    testRuntimeOnly "com.h2database:h2"                                        // 测试环境使用内存数据库，避免依赖真实 MySQL。
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"               // 对齐 Gradle 与 JUnit Platform 运行器版本，避免测试发现阶段版本错配。
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"                     // 固定源码编码，避免中文注释和提示词在不同环境乱码。
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == "com.alibaba.nacos"
                && (details.requested.name == "nacos-client" || details.requested.name.startsWith("nacos-"))) {
            details.useVersion versions.nacosClient
            details.because "Nacos client must match the 3.2.2 server line used by the shared microservice environment."
        }
    }
}

tasks.named("test") {
    useJUnitPlatform()                             // 使用 JUnit Platform 执行 JUnit 5 测试。
}
